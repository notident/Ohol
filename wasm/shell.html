<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>One Hour One Life</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#222}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#ddd}}
:root[data-theme="dark"]{--bg:#111;--fg:#ddd}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;outline:none}
#status{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:5;text-align:center;padding:20px}
progress{width:min(80vw,320px)}
</style></head><body>
<div id="status"><div id="msg">Downloading game…</div><progress id="bar" value="0" max="100"></progress></div>
<div id="wrap"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<script>
var Module = {
  canvas: document.getElementById('canvas'),
  print: function(t){ console.log(t); },
  printErr: function(t){ console.warn(t); },
  setStatus: function(t){
    var m = /(\d+)\/(\d+)/.exec(t);
    if (m) document.getElementById('bar').value = 100*m[1]/m[2];
    if (t === '') document.getElementById('status').style.display = 'none';
    else document.getElementById('msg').textContent = t;
  },
  // touch: one finger acts as the left mouse button (SDL already maps it)
  onAbort: function(w){ document.getElementById('status').style.display='flex';
    document.getElementById('msg').textContent = 'The game crashed: ' + w; }
};
</script>
{{{ SCRIPT }}}
</body></html>
