name: Build browser version

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: This repo (patches and build scripts)
        uses: actions/checkout@v4
        with:
          path: web

      - name: OneLife source
        uses: actions/checkout@v4
        with:
          repository: jasonrohrer/OneLife
          path: OneLife

      - name: minorGems source
        uses: actions/checkout@v4
        with:
          repository: jasonrohrer/minorGems
          path: minorGems

      - name: Game data
        uses: actions/checkout@v4
        with:
          repository: jasonrohrer/OneLifeData7
          path: OneLifeData7

      - name: Apply the browser-port patches
        run: |
          P=web
          if [ ! -d web/patches ] && [ -d web/web/patches ]; then P=web/web; fi
          ls "$P" "$P/patches" "$P/wasm"
          (cd OneLife && patch -p1 < "../$P/patches/onelife.patch")
          (cd minorGems && patch -p1 < "../$P/patches/minorgems.patch")
          cp -r "$P/wasm" OneLife/wasm

      - name: Show build script and inject fixes
        run: |
          echo "=========== build-client.sh (truncated long lines) ==========="
          cut -c1-300 OneLife/wasm/build-client.sh
          echo "=========== end build-client.sh ==========="

          # Create stub file in same dir as ScreenGL_SDL.cpp (already compiled)
          cat > minorGems/graphics/openGL/sdl_stubs_wasm.cpp <<'STUB_EOF'
          #ifdef __EMSCRIPTEN__
          #include <stdint.h>
          struct SDL_Cursor;
          extern "C" {
              int SDL_putenv(const char *v) { (void)v; return 0; }
              struct SDL_Cursor *SDL_CreateCursor(uint8_t *d, uint8_t *m, int w, int h, int hx, int hy) {
                  (void)d; (void)m; (void)w; (void)h; (void)hx; (void)hy;
                  return 0;
              }
              void SDL_SetCursor(struct SDL_Cursor *c) { (void)c; }
              void SDL_FreeCursor(struct SDL_Cursor *c) { (void)c; }
          }
          #endif
          STUB_EOF
          echo "created minorGems/graphics/openGL/sdl_stubs_wasm.cpp"

          # Best-effort flag injection for common patterns
          sed -i 's|^emcc |emcc -sLEGACY_GL_EMULATION=1 |g'  OneLife/wasm/build-client.sh
          sed -i 's|^em++ |em++ -sLEGACY_GL_EMULATION=1 |g'  OneLife/wasm/build-client.sh
          sed -i 's|^\([[:space:]]*\)emcc |\1emcc -sLEGACY_GL_EMULATION=1 |g' OneLife/wasm/build-client.sh
          sed -i 's|^\([[:space:]]*\)em++ |\1em++ -sLEGACY_GL_EMULATION=1 |g' OneLife/wasm/build-client.sh

          echo "--- after sed, emcc/em++ lines: ---"
          grep -n 'emcc\|em++' OneLife/wasm/build-client.sh | head -20 || echo "none found"

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Build
        run: |
          # Shadow emcc/em++ so any unqualified call gets the flag automatically
          emcc() { command emcc -sLEGACY_GL_EMULATION=1 "$@"; }
          em++() { command em++ -sLEGACY_GL_EMULATION=1 "$@"; }
          export -f emcc em++

          find OneLife minorGems -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/\bregister\b//g' {} +
          chmod +x OneLife/wasm/build-client.sh
          bash OneLife/wasm/build-client.sh

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: OneLife/wasm/logs
          if-no-files-found: ignore

      - name: Package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: OneLife/wasm/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
