name: Build browser version

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: This repo (patches and build scripts)
        uses: actions/checkout@v4
        with:
          path: web

      - name: OneLife source
        uses: actions/checkout@v4
        with:
          repository: jasonrohrer/OneLife
          path: OneLife

      - name: minorGems source
        uses: actions/checkout@v4
        with:
          repository: jasonrohrer/minorGems
          path: minorGems

      - name: Game data
        uses: actions/checkout@v4
        with:
          repository: jasonrohrer/OneLifeData7
          path: OneLifeData7

      - name: Apply the browser-port patches
        run: |
          P=web
          if [ ! -d web/patches ] && [ -d web/web/patches ]; then P=web/web; fi
          (cd OneLife && patch -p1 < "../$P/patches/onelife.patch")
          (cd minorGems && patch -p1 < "../$P/patches/minorgems.patch")
          cp -r "$P/wasm" OneLife/wasm

      - name: Patch build script (stub + GL flag)
        run: |
          cat > /tmp/sdl_stubs.cpp <<'STUB'
          #ifdef __EMSCRIPTEN__
          #include <stdint.h>
          struct SDL_Cursor;
          extern "C" {
              int SDL_putenv(const char *v) { (void)v; return 0; }
              struct SDL_Cursor *SDL_CreateCursor(uint8_t *d, uint8_t *m, int w, int h, int hx, int hy) {
                  (void)d; (void)m; (void)w; (void)h; (void)hx; (void)hy;
                  return 0;
              }
              void SDL_SetCursor(struct SDL_Cursor *c) { (void)c; }
              void SDL_FreeCursor(struct SDL_Cursor *c) { (void)c; }
          }
          #endif
          STUB

          python3 - <<'PY'
          p = 'OneLife/wasm/build-client.sh'
          s = open(p).read()
          link_marker = 'em++ -O2 -fexceptions "$OBJ"/*.o'
          if link_marker in s and 'zz_stubs.o' not in s:
              stub_line = 'em++ -O2 -fexceptions -I"$WORK" -w -c /tmp/sdl_stubs.cpp -o "$OBJ/zz_stubs.o"\n'
              s = s.replace(link_marker, stub_line + link_marker)
          s = s.replace('-sLEGACY_GL_EMULATION=1', '-sLEGACY_GL_EMULATION=1 -sFULL_ES2=1')
          open(p, 'w').write(s)
          print("patched build-client.sh")
          PY

          echo "=== relevant lines in build-client.sh now ==="
          grep -n 'sdl_stubs\|FULL_ES2\|LEGACY_GL\|em++ -O2 -fexceptions "\$OBJ"' OneLife/wasm/build-client.sh

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Build
        run: |
          find OneLife minorGems -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/\bregister\b//g' {} +
          chmod +x OneLife/wasm/build-client.sh
          bash OneLife/wasm/build-client.sh

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: OneLife/wasm/logs
          if-no-files-found: ignore

      - name: Package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: OneLife/wasm/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
