name: Build browser version

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: This repo (patches and build scripts)
        uses: actions/checkout@v4
        with:
          path: web

      - name: OneLife source
        uses: actions/checkout@v4
        with:
          repository: jasonrohrer/OneLife
          path: OneLife

      - name: minorGems source
        uses: actions/checkout@v4
        with:
          repository: jasonrohrer/minorGems
          path: minorGems

      - name: Game data
        uses: actions/checkout@v4
        with:
          repository: jasonrohrer/OneLifeData7
          path: OneLifeData7

      - name: Apply the browser-port patches
        run: |
          P=web
          if [ ! -d web/patches ] && [ -d web/web/patches ]; then P=web/web; fi
          ls "$P" "$P/patches" "$P/wasm"
          (cd OneLife && patch -p1 < "../$P/patches/onelife.patch")
          (cd minorGems && patch -p1 < "../$P/patches/minorgems.patch")
          cp -r "$P/wasm" OneLife/wasm

      - name: Add SDL stubs and legacy GL flag
        run: |
          # Create SDL stub source so the linker can find SDL_putenv etc.
          cat > minorGems/graphics/openGL/sdl_stubs.cpp <<'EOF'
          #ifdef __EMSCRIPTEN__
          #include <SDL/SDL.h>
          extern "C" {
              int SDL_putenv(const char *variable) { return 0; }
              SDL_Cursor* SDL_CreateCursor(Uint8 *data, Uint8 *mask, int w, int h, int hot_x, int hot_y) { return nullptr; }
              void SDL_SetCursor(SDL_Cursor *cursor) {}
              void SDL_FreeCursor(SDL_Cursor *cursor) {}
          }
          #endif
          EOF

          # Add LEGACY_GL_EMULATION to every emcc/em++ call
          sed -i 's|em++ |em++ -sLEGACY_GL_EMULATION=1 |g' OneLife/wasm/build-client.sh
          sed -i 's|emcc |emcc -sLEGACY_GL_EMULATION=1 |g' OneLife/wasm/build-client.sh

          echo "=== emcc/em++ lines in build-client.sh ==="
          grep -n "em++\|emcc" OneLife/wasm/build-client.sh | head -10 || true

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Build
        run: |
          find OneLife minorGems -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/\bregister\b//g' {} +
          chmod +x OneLife/wasm/build-client.sh
          OneLife/wasm/build-client.sh

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: OneLife/wasm/logs
          if-no-files-found: ignore

      - name: Package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: OneLife/wasm/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
